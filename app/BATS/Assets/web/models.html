<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' blob:;connect-src 'self';object-src 'none'"><title>BATS · 学生模型库</title><link rel="stylesheet" href="bats.css"></head><body>
<header class="bar"><span class="brand">BATS</span><p>学生 · 服装 · 本地 3D 模型</p><nav><a class="button" data-hall href="index.html">返回大厅</a><a class="button" href="tasks.html">任务与角色配置</a></nav></header>
<div class="workspace"><aside class="panel model-panel"><span class="tag">3D 模型与动作库</span><h1 id="model-title">正在读取目录</h1><p id="model-code" class="muted"></p>
<input id="model-search" type="search" placeholder="姓名 / 素材编号 / 角色 ID" aria-label="搜索学生模型"><label class="compact">只看可预览<input id="model-ready-only" type="checkbox" checked></label><p id="model-count" class="muted"></p><select id="model-picker" aria-label="学生与服装模型"></select><div class="model-pagination"><button id="model-prev">上一个</button><button id="model-next">下一个</button></div>
<p id="model-status" role="status">正在读取内置模型目录…</p>
<details id="animation-controls" open><summary>人物动作</summary><p id="animation-status" class="muted">正在检查原始动作…</p><select id="animation-picker" aria-label="人物动作" disabled><option value="static">静态姿态</option></select><div class="model-pagination"><button id="animation-play" disabled>播放</button><label class="compact">循环<input id="animation-loop" type="checkbox" checked disabled></label></div><label>动作进度<input id="animation-seek" aria-label="动作进度" type="range" min="0" max="1000" value="0" step="1" disabled></label><p id="animation-time" class="muted"></p><label>播放速度<select id="animation-speed" aria-label="动作播放速度" disabled><option value=".5">0.5 倍</option><option value="1" selected>1 倍</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option></select></label></details><details id="model-controls" open><summary>查看设置</summary><label>缩放<input id="model-zoom" aria-label="模型缩放" type="range" min=".5" max="2" step=".05" value="1"></label><label>配件分开展示<input id="model-separated" type="checkbox" checked></label><label>场景道具与载具<input id="model-props" type="checkbox"></label><label>显示源文件隐藏部件<input id="model-hidden" type="checkbox"></label><label>自动旋转<input id="model-spin" type="checkbox"></label><button id="model-reset">恢复视角</button></details>
<details><summary>模型说明与待完善项</summary><p id="model-notes" class="muted"></p><p class="muted">静态姿态可分开检查配件；动作模式使用原始骨骼和武器挂点，恢复源文件的部件显示状态。尚未实现动作状态机、攻击特效、动态口型与原作光照；动作预览不代表可参战。目录保留不同服装与战斗形态。</p></details></aside><main id="model-stage"><canvas id="model-canvas" aria-label="可旋转的学生三维模型"></canvas><div class="caption">拖动旋转 · 滑条缩放 · 所有模型随安装包离线提供</div></main></div>
<script type="module" src="bats-nav.mjs"></script><script type="module" src="model-viewer.mjs"></script></body></html>
